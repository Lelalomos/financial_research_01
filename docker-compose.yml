version: '3.8'

services:
  # Main service - runs in background for interactive use
  crnn-prediction:
    build: .
    image: financial-prediction-03:latest
    container_name: crnn_predictor

    # Volume mounts
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models:/app/models
      - ./outputs:/app/outputs
      - ./notebooks:/app/notebooks
      - ./scripts:/app/scripts

    # Environment variables
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - CUDA_VISIBLE_DEVICES=0  # Enable GPU

    # Resource limits (adjust based on your system)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    # Keep container running
    restart: unless-stopped

    # Detached mode (run in background)
    stdin_open: true
    tty: true

  # Jupyter notebook service for analysis
  jupyter:
    build: .
    image: crnn-financial-prediction:latest
    container_name: crnn_jupyter

    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models:/app/models
      - ./outputs:/app/outputs
      - ./notebooks:/app/notebooks

    environment:
      - PYTHONPATH=/app
      - JUPYTER_ENABLE_LAB=yes

    command: >
      bash -c "pip install jupyter jupyterlab &&
      jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token=''"

    ports:
      - "8888:8888"

    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2'
    #       memory: 4G

    profiles:
      - jupyter  # Only start with --profile jupyter

  # Training-only service (for GPU nodes)
  trainer:
    build: .
    image: crnn-financial-prediction:latest
    container_name: crnn_trainer

    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models:/app/models
      - ./outputs:/app/outputs

    environment:
      - PYTHONPATH=/app
      - CUDA_VISIBLE_DEVICES=0

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    profiles:
      - gpu  # Only start with --profile gpu
