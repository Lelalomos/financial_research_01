version: '3.8'

services:
  # Main service - runs in background for interactive use
  crnn-prediction:
    build: .
    image: financial-prediction-05:latest
    container_name: crnn_predictor

    # Volume mounts
    volumes:
      - ./data:/app/data
      - ./raw_data:/app/raw_data
      - ./logs:/app/logs
      - ./models:/app/models
      - ./outputs:/app/outputs
      - ./scripts:/app/scripts
      - ./src:/app/src
      - ./config:/app/config
      - ./reports:/app/reports
      - ./tests:/app/tests

    # Environment variables
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - CUDA_VISIBLE_DEVICES=0  # Enable GPU

    # Resource limits (adjust based on your system)
    deploy:
      resources:
        limits:
          memory: 16G  # Maximum RAM the container can use
        reservations:
          memory: 4G   # Reserved RAM
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    # OOM killer settings - kill processes when system RAM < 2GB
    oom_kill_disable: false
    memswap_limit: 18G  # Swap + RAM limit (triggers OOM when exceeded)

    # Keep container running
    restart: unless-stopped

    # Detached mode (run in background)
    stdin_open: true
    tty: true

  # Training-only service (for GPU nodes)
  trainer:
    build: .
    image: crnn-financial-prediction:latest
    container_name: crnn_trainer

    volumes:
      - ./data:/app/data
      - ./raw_data:/app/raw_data
      - ./logs:/app/logs
      - ./models:/app/models
      - ./outputs:/app/outputs

    environment:
      - PYTHONPATH=/app
      - CUDA_VISIBLE_DEVICES=0

    deploy:
      resources:
        limits:
          memory: 16G
        reservations:
          memory: 4G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    # OOM killer settings
    oom_kill_disable: false
    memswap_limit: 18G

    profiles:
      - gpu  # Only start with --profile gpu
